# Pages CMS configuration (https://pagescms.org). Edits here become commits;
# every commit to main rebuilds the site through .github/workflows/deploy.yml.
media:
  input: src/assets/media
  output: /assets/media

content:
  - name: notes
    label: Notes (Briefs, Comparative Notes, Editorials)
    type: collection
    path: src/notes
    filename: "{primary}.md"
    format: yaml-frontmatter
    exclude: [notes.11tydata.js]
    view:
      fields: [title, format, date, status, version]
      primary: title
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: format
        label: Format
        type: select
        default: Brief
        options: { values: [Brief, Comparative Note, Editorial] }
      - { name: date, label: Date (first dated), type: date, required: true }
      - { name: updated, label: Last revised, type: date }
      - { name: last_verified, label: Sources last checked, type: date }
      - { name: published, label: Published (not a draft), type: boolean, default: false }
      - name: status
        label: Status
        type: select
        default: Draft
        options: { values: [Draft, Published, Updated, Withdrawn] }
      - { name: version, label: Version, type: string, default: "0.1", description: "Raise it for every substantive text change and add a line to the version history." }
      - { name: cases, label: Case IDs this note concerns, type: string, list: true }
      - { name: description, label: Short description (search engines, link previews), type: string }
      - { name: standfirst, label: Standfirst, type: text }
      - { name: excerpt, label: Excerpt on the Notes page (blank line between paragraphs), type: text }
      - { name: body, label: Text, type: rich-text }
      - { name: authors, label: "Author IDs (from People; leave empty for the editor)", type: string, list: true }
      - { name: received, label: Received (guest contributions), type: date }
      - { name: accepted, label: Accepted (guest contributions), type: date }
      - { name: competing_interests, label: "Competing interests (state “None declared.” explicitly)", type: text }
      - { name: ai_note, label: AI use and review status, type: text, required: true, description: "Name the tool, the tasks it assisted with and the review status." }
      - name: sources
        label: Sources
        type: object
        list: true
        fields:
          - name: type
            label: Source type
            type: select
            options: { values: [Institutional, Supplier, Media, Interview, PAIR inference] }
          - { name: title, label: Source, type: string }
          - { name: url, label: URL, type: string }
          - { name: note, label: Note (e.g. accessed date), type: string }
      - { name: sources_note, label: Text shown if no sources are listed, type: string }
      - { name: doi, label: DOI (only once registered on Zenodo), type: string }
      - { name: citation, label: Citation override (leave empty for the automatic one), type: text }
      - name: versions
        label: Version history (newest first)
        type: object
        list: true
        fields:
          - { name: version, label: Version, type: string }
          - { name: date, label: Date, type: date }
          - { name: change, label: What changed, type: string }

  - name: cases
    label: Case Profiles
    type: collection
    path: src/cases
    filename: "{fields.case_id}.md"
    format: yaml-frontmatter
    exclude: [cases.11tydata.js]
    view:
      fields: [case_id, title, deployment_status, last_verified]
      primary: title
      sort: [case_id, last_verified]
      default: { sort: case_id, order: asc }
    fields:
      - { name: case_id, label: "Case ID (PAIR-XXX-YY-001, never change or reuse)", type: string, required: true, description: "Pattern PAIR-[country code]-[chamber]-[three digits]. The URL is built from it." }
      - { name: title, label: "Title (system name, parliament)", type: string, required: true }
      - { name: summary, label: One-sentence summary, type: text }
      - { name: country, label: Country, type: string }
      - { name: parliament, label: Parliament / chamber, type: string, required: true }
      - { name: unit, label: Administrative unit, type: string }
      - { name: task, label: Task, type: string, required: true }
      - name: function
        label: Parliamentary function
        type: select
        options: { values: [Legislation, Scrutiny, Representation and communication, Records and documentation, Research and information, Administration, Unclear] }
      - name: provider
        label: Development
        type: select
        options: { values: [In-house, Vendor, Mixed, Unclear] }
      - { name: provider_name, label: Supplier name, type: string }
      - name: deployment_status
        label: Deployment status
        type: select
        required: true
        options: { values: [Announced, Pilot, Operational, Discontinued, Unclear] }
      - { name: status_basis, label: "Status rests on (e.g. institutional source; supplier account only)", type: string }
      - { name: first_evidence, label: First evidence, type: date }
      - { name: last_verified, label: Status last verified, type: date }
      - { name: date, label: Profile first dated, type: date, required: true }
      - { name: updated, label: Last revised, type: date }
      - { name: published, label: Published (not a draft), type: boolean, default: false }
      - name: status
        label: Editorial status
        type: select
        default: Draft
        options: { values: [Draft, Published, Updated, Withdrawn] }
      - { name: version, label: Version, type: string, default: "0.1" }
      - { name: body, label: Text, type: rich-text }
      - { name: authors, label: "Author IDs (from People; leave empty for the editor)", type: string, list: true }
      - { name: received, label: Received (guest contributions), type: date }
      - { name: accepted, label: Accepted (guest contributions), type: date }
      - { name: competing_interests, label: "Competing interests (state “None declared.” explicitly)", type: text }
      - { name: ai_note, label: AI use and review status, type: text, required: true }
      - name: sources
        label: Sources
        type: object
        list: true
        fields:
          - name: type
            label: Source type
            type: select
            options: { values: [Institutional, Supplier, Media, Interview, PAIR inference] }
          - { name: title, label: Source, type: string }
          - { name: url, label: URL, type: string }
          - { name: note, label: Note (e.g. accessed date), type: string }
      - { name: sources_note, label: Text shown if no sources are listed, type: string }
      - { name: doi, label: DOI (only once registered on Zenodo), type: string }
      - { name: citation, label: Citation override (leave empty for the automatic one), type: text }
      - name: versions
        label: Version history (newest first)
        type: object
        list: true
        fields:
          - { name: version, label: Version, type: string }
          - { name: date, label: Date, type: date }
          - { name: change, label: What changed, type: string }

  - name: newsletter
    label: Newsletter issues
    type: collection
    path: src/newsletter
    filename: "{month}.md"
    format: yaml-frontmatter
    exclude: [newsletter.11tydata.js]
    view:
      fields: [month, date, published]
      primary: month
      default: { sort: date, order: desc }
    fields:
      - { name: date, label: Sending date, type: date, required: true }
      - { name: month, label: "Month covered (YYYY-MM, e.g. 2026-10). Becomes the address /newsletter/2026-10/", type: string, required: true }
      - { name: published, label: Published in the archive, type: boolean, default: false }
      - { name: body, label: "Editor's introduction", type: rich-text, description: "New contributions and case checks of the month are listed automatically below this text." }

  - name: people
    label: People (authors)
    type: file
    path: src/_data/people.json
    format: json
    list: true
    fields:
      - { name: id, label: "ID (lowercase-with-hyphens, never change)", type: string, required: true }
      - { name: name, label: Name, type: string, required: true }
      - { name: bibtex, label: "Name for citations (Surname, First names)", type: string, required: true }
      - { name: role, label: "Role (Editor, Contributor)", type: string }
      - { name: affiliation, label: Affiliation, type: string }
      - { name: orcid, label: ORCID URL, type: string }
      - { name: bio, label: Short bio (one sentence), type: text }

  - name: contribute
    label: Contribute page
    type: file
    path: src/contribute.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: body, label: Text, type: rich-text }
      - { name: draft_note, label: Note at the end, type: text }

  - name: about
    label: About page
    type: file
    path: src/about.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: body, label: Text, type: rich-text }

  - name: method
    label: Method page
    type: file
    path: src/method.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: intro, label: Introduction, type: text }
      - { name: body, label: Text, type: rich-text }
      - { name: draft_note, label: Note at the end, type: text }

  - name: home
    label: Notes page texts
    type: file
    path: src/_data/home.json
    format: json
    fields:
      - { name: about_heading, label: About heading, type: string }
      - { name: about_text, label: About text, type: text }
      - { name: about_link, label: About link text, type: string }
      - { name: draft_note, label: Draft note (leave empty to hide), type: text }

  - name: legal
    label: Legal notice
    type: file
    path: src/legal-notice.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: body, label: Text, type: rich-text }
      - { name: draft_note, label: Placeholder note (empty when complete), type: text }

  - name: privacy
    label: Privacy
    type: file
    path: src/privacy.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: body, label: Text, type: rich-text }
      - { name: draft_note, label: Placeholder note (empty when complete), type: text }

  - name: settings
    label: Site settings
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: title, label: Site title, type: string }
      - { name: author, label: Author, type: string }
      - { name: editor, label: "Editor's ID in People", type: string }
      - { name: contributions_open, label: Guest contributions open, type: boolean }
      - { name: url, label: "Site address, without trailing slash (used in citations)", type: string }
      - { name: licence, label: Licence, type: string }
      - { name: licence_url, label: Licence URL, type: string }
      - { name: previewLabel, label: Preview label in navigation (empty to hide), type: string }
      - { name: noindex, label: Hide from search engines, type: boolean, description: "Switch off only when the site is ready to be public." }
      - name: newsletter
        label: Newsletter
        type: object
        fields:
          - { name: name, label: Newsletter name, type: string }
          - { name: provider, label: Service provider, type: string }
          - { name: form_action, label: "Sign-up form URL from the provider (empty = form hidden)", type: string, description: "Fill in only after the privacy page covers the newsletter." }
          - { name: email_field, label: "Name of the email field expected by the provider (e.g. EMAIL)", type: string }
          - { name: privacy_note, label: Extra sentence under the form, type: string }
